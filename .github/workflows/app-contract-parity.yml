name: App contract parity

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Immutable Ascii-Motion commit containing the corresponding generated contract
        required: true
        type: string
  repository_dispatch:
    types: [ascii-motion-contract-updated]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable app commit
        env:
          APP_REF: ${{ inputs.app_ref || github.event.client_payload.app_ref }}
        run: |
          if [[ ! "$APP_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::app_ref must be a full 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: mcp
      - uses: actions/checkout@v4
        with:
          repository: CameronFoxly/Ascii-Motion
          ref: ${{ inputs.app_ref || github.event.client_payload.app_ref }}
          path: app
          sparse-checkout: src/mcp/contract
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mcp
      - run: npm run sync:bridge-contract -- --check --source ../app/src/mcp/contract/bridge-contract.json
        working-directory: mcp
